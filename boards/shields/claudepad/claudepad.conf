# =============================================================================
# ClaudePad 配置建议
# -----------------------------------------------------------------------------
# ⚠️ 在这个文件里设置的项，用户将无法再用自己的 .conf 覆盖。
#    所以这里只放「这个键盘必须这样配」的项目，不放可选项。
#    想改配置的用户请编辑自己的 config/claudepad.conf（优先级更高）。
# =============================================================================

# ---- 省电 ----
# 允许深度睡眠（BLE 键盘续航的关键）
CONFIG_ZMK_SLEEP=y

# 空闲 30 分钟后进入深度睡眠（单位 ms）
CONFIG_ZMK_IDLE_TIMEOUT=1800000

# ---- 蓝牙 ----
# 提高发射功率，改善连接稳定性（nRF52840 支持 +8dBm）
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ---- 宏 ----
# m_quit 之类的序列宏需要足够的队列深度（默认 64 够用，这里给足余量）
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=256

# =============================================================================
# 以下为可选增强，确认硬件支持后再打开
# =============================================================================

# ---- ⚠️ NKRO 与 F13 的冲突（重要）----
# 审批拨杆绑定的是 F13。官方文档明确说明：
#   NKRO 默认的报告长度下，**F13–F24 不会生效**（为了兼容性被裁掉了）。
# 所以如果你要启用 NKRO，必须同时打开扩展报告：
#
# CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y
# CONFIG_ZMK_HID_KEYBOARD_NKRO_EXTENDED_REPORT=y   # ← 不加这行，审批拨杆会失效
#
# 注意：扩展报告已知会破坏部分 Android 设备的兼容性。
# 默认的 HKRO（6KRO）模式下 F13 正常工作，无需额外配置。

# ---- 每键 RGB（WS2812）----
# ⚠️ 需要 PCB 上已焊接 WS2812 且数据线接到正确引脚（本项目定为 D15）。
#    基础固件只支持整体单色；PRD 第 8 章要求的「按键状态指示不同颜色」
#    需要额外的自定义固件（见 docs/固件设计说明.md）。
#
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y
# CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
# CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# ---- 审批拨杆（当前作为矩阵里的一个普通按键处理）----
# 如果改用独立 GPIO 读取拨杆状态，需要自定义驱动，
# 见 docs/固件设计说明.md 的「后续工作」。
