[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claudepad-host"
version = "0.1.0"
description = "Windows companion host for the ClaudePad macropad"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
claudepad-host = "claudepad_host.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["claudepad_host*"]
