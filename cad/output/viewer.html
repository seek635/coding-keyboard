<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClaudePad 三维结构查看器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  body { background: #eef1f5; color: #2c2c2a; }
  #app { display: flex; height: 100%; }

  #viewport { flex: 1; position: relative; }
  canvas { display: block; }

  #panel {
    width: 268px; background: #fff; border-left: 1px solid #d8dce3;
    padding: 18px 16px; overflow-y: auto; flex-shrink: 0;
  }
  #panel h1 { font-size: 15px; font-weight: 600; margin-bottom: 3px; }
  #panel .sub { font-size: 12px; color: #6b7280; margin-bottom: 16px; line-height: 1.5; }

  .group { margin-bottom: 18px; }
  .group > label.title {
    display: block; font-size: 12px; font-weight: 600; color: #374151;
    margin-bottom: 8px; letter-spacing: .3px;
  }
  .row { display: flex; align-items: center; gap: 8px;
    padding: 5px 0; font-size: 13px; cursor: pointer; }
  .row input { cursor: pointer; }
  .swatch { width: 12px; height: 12px; border-radius: 3px;
    border: 1px solid rgba(0,0,0,.18); flex-shrink: 0; }

  input[type=range] { width: 100%; margin-top: 4px; }
  .val { font-size: 11px; color: #6b7280; float: right; }

  button {
    width: 100%; padding: 8px; margin-top: 6px; font-size: 13px;
    border: 1px solid #d1d5db; background: #f9fafb; border-radius: 6px;
    cursor: pointer; color: #374151;
  }
  button:hover { background: #f3f4f6; }
  button.on { background: #1f6feb; border-color: #1f6feb; color: #fff; }

  .spec { font-size: 12px; line-height: 1.85; color: #4b5563; }
  .spec b { color: #111827; font-weight: 600; }
  .spec .k { color: #6b7280; }

  #loading {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; background: #eef1f5; font-size: 13px; color: #6b7280;
    z-index: 10;
  }
  #hint {
    position: absolute; left: 14px; bottom: 12px; font-size: 11px;
    color: #9ca3af; pointer-events: none;
  }
  #err { color: #b91c1c; font-size: 12px; line-height: 1.6; }
</style>
</head>
<body>
<div id="app">
  <div id="viewport">
    <div id="loading">正在加载三维模型…</div>
    <div id="hint">左键拖动旋转 · 滚轮缩放 · 右键平移</div>
  </div>

  <div id="panel">
    <h1>ClaudePad 三维结构</h1>
    <div class="sub">三行五列 11 键 + 侧边审批拨杆<br><!--GEN:SIZE-->尺寸 107.10 × 71.10 × 23.10 mm<!--/GEN:SIZE--></div>

    <div class="group">
      <label class="title">零件显示</label>
      <div id="toggles"></div>
    </div>

    <div class="group">
      <label class="title">爆炸拆解 <span class="val" id="exVal">0 mm</span></label>
      <input type="range" id="explode" min="0" max="100" value="0">
    </div>

    <div class="group">
      <button id="spin">自动旋转</button>
      <button id="reset">复位视角</button>
      <button id="top">俯视图</button>
    </div>

    <div class="group">
      <label class="title">垂直尺寸链</label>
      <div class="spec">
        <!--GEN:CHAIN-->
        <span class="k">键帽顶面</span> <b>z = 23.10</b><br>
        <span class="k">键帽底面</span> <b>z = 18.10</b><br>
        <span class="k">定位板顶面</span> <b>z = 14.80</b><br>
        <span class="k">定位板底面</span> <b>z = 13.60</b><br>
        <span class="k">PCB 上表面</span> <b>z = 8.60</b><br>
        <span class="k">PCB 下表面</span> <b>z = 7.00</b><br>
        <span class="k">底板上表面</span> <b>z = 2.00</b><br>
        <span class="k">桌面</span> <b>z = 0.00</b>
        <!--/GEN:CHAIN-->
      </div>
    </div>

    <div class="group">
      <!--GEN:INNER-->
      <label class="title">内腔净高 11.6 mm</label>
      <div class="spec">
        <span class="k">电池/走线层</span> <b>5.0</b><br>
        <span class="k">PCB</span> <b>1.6</b><br>
        <span class="k">轴体卡扣间隙</span> <b>5.0</b>
      </div>
      <!--/GEN:INNER-->
    </div>

    <div id="err"></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---- 与 cad/lib/params.scad 保持一致的尺寸 -------------------------------
// ⚠️ 本区块由 tools/gen_viewer.py 自动生成，不要手改。
//    改尺寸请改 cad/lib/params.scad，然后跑：python tools/gen_viewer.py
//GEN:CONST
const PITCH = 18.0, CASE_WALL = 2.4, BORDER = 6.0;
const PLATE_BOTTOM_Z = 13.6, PLATE_T = 1.2, CAP_GAP = 3.3;
const CAP_Z = PLATE_BOTTOM_Z + PLATE_T + CAP_GAP;   // 18.1
//GEN:CONST-END

// [列, 行, 宽度u, 标签]
const KEYMAP = [
  [1,1,1,'访问等级'], [2,1,1,'↑'], [3,1,1,'模型'], [4,1,1,'命令行'], [5,1,1,'停止'],
  [1,2,1,'←'], [2,2,1,'↓'], [3,2,1,'→'], [4,2,2,'回车'],
  [1,3,4,'空格'], [5,3,1,'语音'],
];

// 每个键帽的绝对位置
function capPos(c, r, u) {
  return [
    CASE_WALL + BORDER + (c - 1) * PITCH + u * PITCH / 2,
    CASE_WALL + BORDER + (r - 1) * PITCH + PITCH / 2,
    CAP_Z,
  ];
}

// 零件清单：文件、名称、颜色、位置、爆炸方向
const COLORS = { case: 0x9db4d0, plate: 0xd8c88c, cap: 0xe8a08c };
const PARTS = [
  { file: '01_case_bottom.stl', name: '底座', color: COLORS.case,
    pos: [0,0,0], ex: [0,0,0], group: 'case' },
  { file: '02_plate.stl', name: '定位板', color: COLORS.plate,
    pos: [CASE_WALL, CASE_WALL, PLATE_BOTTOM_Z], ex: [0,0,16], group: 'plate' },
];

// 键帽按宽度分三个 STL，但每个键帽位置不同
const CAP_FILES = { 1: '03_keycap_1u.stl', 2: '04_keycap_2u.stl', 4: '05_keycap_4u.stl' };
KEYMAP.forEach(([c, r, u, label]) => {
  PARTS.push({
    file: CAP_FILES[u], name: '键帽 ' + label, color: COLORS.cap,
    pos: capPos(c, r, u), ex: [0,0,34], group: 'cap', small: true,
  });
});

// ---- 场景 ----------------------------------------------------------------
const vp = document.getElementById('viewport');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeef1f5);

const camera = new THREE.PerspectiveCamera(38, vp.clientWidth / vp.clientHeight, 1, 2000);
camera.position.set(190, -210, 175);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(vp.clientWidth, vp.clientHeight);
vp.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(53, 35, 10);

// 光照
scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 1.05));
const key = new THREE.DirectionalLight(0xffffff, 1.5);
key.position.set(120, -160, 240);
scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.55);
fill.position.set(-160, 120, 90);
scene.add(fill);

// 地面网格（便于判断方位）
const grid = new THREE.GridHelper(300, 30, 0xc3cad4, 0xdde2e9);
grid.position.set(53, 35, 0);
scene.add(grid);

// ---- 加载 STL ------------------------------------------------------------
const loader = new STLLoader();
const meshes = [];
let pending = PARTS.length;
let failed = 0;

PARTS.forEach((p, i) => {
  loader.load(p.file, (geo) => {
    geo.computeVertexNormals();
    const mat = new THREE.MeshStandardMaterial({
      color: p.color, metalness: 0.05, roughness: 0.72,
      flatShading: false,
    });
    const m = new THREE.Mesh(geo, mat);
    m.position.set(...p.pos);
    m.userData = p;
    m.userData.baseZ = p.pos[2];
    scene.add(m);
    meshes.push(m);
    if (--pending === 0) done();
  }, undefined, () => {
    failed++;
    if (--pending === 0) done();
  });
});

function done() {
  document.getElementById('loading').style.display = 'none';
  if (failed) {
    document.getElementById('err').textContent =
      failed + ' 个零件加载失败。请通过本地 HTTP 服务打开本页面（不能直接双击打开文件）。';
  }
  buildToggles();
}

// ---- 零件开关 ------------------------------------------------------------
function buildToggles() {
  const box = document.getElementById('toggles');
  const groups = [
    { key: 'case', label: '底座', color: COLORS.case, n: 1 },
    { key: 'plate', label: '定位板', color: COLORS.plate, n: 1 },
    { key: 'cap', label: '键帽（11 个）', color: COLORS.cap, n: 11 },
  ];
  groups.forEach(g => {
    const row = document.createElement('label');
    row.className = 'row';
    row.innerHTML =
      '<input type="checkbox" checked>' +
      '<span class="swatch" style="background:#' + g.color.toString(16).padStart(6,'0') + '"></span>' +
      '<span>' + g.label + '</span>';
    row.querySelector('input').addEventListener('change', e => {
      meshes.forEach(m => { if (m.userData.group === g.key) m.visible = e.target.checked; });
    });
    box.appendChild(row);
  });
}

// ---- 爆炸拆解 ------------------------------------------------------------
const exSlider = document.getElementById('explode');
const exVal = document.getElementById('exVal');
exSlider.addEventListener('input', () => {
  const t = exSlider.value / 100;
  exVal.textContent = Math.round(t * 34) + ' mm';
  meshes.forEach(m => {
    m.position.set(
      m.userData.pos[0] + m.userData.ex[0] * t,
      m.userData.pos[1] + m.userData.ex[1] * t,
      m.userData.baseZ + m.userData.ex[2] * t
    );
  });
});

// ---- 视角按钮 ------------------------------------------------------------
const spinBtn = document.getElementById('spin');
let spinning = false;
spinBtn.addEventListener('click', () => {
  spinning = !spinning;
  spinBtn.classList.toggle('on', spinning);
  controls.autoRotate = spinning;
  controls.autoRotateSpeed = 1.6;
});

function flyTo(x, y, z) {
  camera.position.set(x, y, z);
  controls.target.set(53, 35, 10);
  controls.update();
}
document.getElementById('reset').addEventListener('click', () => flyTo(190, -210, 175));
document.getElementById('top').addEventListener('click', () => flyTo(53, 35, 300));

// ---- 渲染循环 ------------------------------------------------------------
function tick() {
  requestAnimationFrame(tick);
  controls.update();
  renderer.render(scene, camera);
}
tick();

addEventListener('resize', () => {
  camera.aspect = vp.clientWidth / vp.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(vp.clientWidth, vp.clientHeight);
});
</script>
</body>
</html>
